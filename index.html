<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="cup">
      <h2 class="cup-title">🔢 Counter App</h2>
      <p class="cup-text">Small steps make big progress. Count away!</p>
      <div class="cup-cub">
        <h4 class="cup-cub-title">CURRENT COUNT</h4>
        <div class="cup-cub-num">0</div>
      </div>

      <div class="cup1">
        <button class="cup1-btn">- Decrease</button>
        <button class="cup1-btn1">Reset</button>
        <button class="cup1-btn2">+ increase</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
